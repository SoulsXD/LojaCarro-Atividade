spring.application.name=LojaCarro

spring.datasource.url=jdbc:mysql://127.0.0.1:3306/lojacarros?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
